<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 80%;
            margin: auto;
        }

        tr,
        td {
            /* border: 1px solid black; */
            height: 22vh;
        }

        .box {
            width: 100%;
            height: 100%;
        }

        .box1 {
            background-color: lightblue;
        }

        .box21 {
            background-color: lightpink;
        }

        .box22 {
            background-color: rgb(128, 64, 74);
        }

        .box31 {
            background-color: lightgoldenrodyellow;
        }

        .box32 {
            background-color: rgb(172, 172, 105);
        }

        .box33 {
            background-color: rgb(206, 206, 82);
        }

        .box41 {
            background-color: lightgreen;
        }

        .box42 {
            background-color: rgb(104, 194, 149);
        }

        .box43 {
            background-color: rgb(63, 163, 133);
        }

        .box44 {
            background-color: rgb(35, 139, 126);
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td>
                <div class="box box1">
                </div>
            </td>
        </tr>

    </table>

    <table>

        <tr>
            <td width="50%">
                <div class="box box21">
                </div>
            </td>
            <td>
                <div class="box box22">
                </div>
            </td>
        </tr>
    </table>

    <table>

        <tr>
            <td width="33%">
                <div class="box box31">
                </div>
            </td>
            <td width="33%">
                <div class="box box32">
                </div>
            </td>
            <td width="33%">
                <div class="box box33">
                </div>
            </td>
        </tr>
    </table>

    <table>

        <tr>
            <td width="25%">
                <div class="box box41">
                </div>
            </td>
            <td width="25%">
                <div class="box box42">
                </div>
            </td>
            <td width="25%">
                <div class="box box43">
                </div>
            </td>
            <td width="25%">
                <div class="box box44">
                </div>
            </td>
        </tr>
    </table>
</body>

</html>
