<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* class . */
        .box {
            width: 300px;
            height: 300px;
            background-color: lightblue;
        }

        /* id # */
        #box1 {}

        #box2 {
            background-color: lightpink;
        }

        /* element 前面沒東西 */
        p {
            color: red;
        }
    </style>
</head>

<body>
    <!-- id class element -->

    <!-- id 單一 -->

    <!-- 權重 id > class > element -->
    <!-- class 群組 -->
    <div class="box">

    </div>

    <br>

    <div id="box2" class="box">

    </div>

    <p>
        Lorem ipsum dolor sit amet.
    </p>

</body>

</html>
