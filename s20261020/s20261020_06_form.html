<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">

        <!-- input:text 文字方塊 -->
        <p>
            <label for="name">姓名</label>
            <input type="text" name="name" id="name">
        </p>
        <p>
            <label for="mobile">電話</label>
            <input type="text" name="mobile" id="mobile">
        </p>

        <!-- input:number 數字方塊 -->
        <p>
            <label for="lucky">幸運數字</label>
        </p>
        <p>
            <input type="number" name="lucky" id="lucky">
        </p>

        <!-- input:radio 單選 圓圈圈-->
        <!-- name 相同 視為同一組 -->
        <p>
            <input type="radio" name="love" id="">
            <label for="">html</label>
            <input type="radio" name="love" id="">
            <label for="">css</label>
            <input type="radio" name="love" id="">
            <label for="">js</label>
        </p>

        <!-- input:checkbox 多選 方形 -->
        <!-- name  [] array - -->
        <p>
            <input type="checkbox" name="myBox[]" id="">
            <label for="">1</label>
            <input type="checkbox" name="myBox[]" id="">
            <label for="">2</label>
            <input type="checkbox" name="myBox[]" id="">
            <label for="">3</label>
        </p>

        <p>
            <label for="">幸運日</label>
            <input type="date" name="" id="">
        </p>


        <!-- select 下拉選單 -->
        <p>
            <label for="">性別</label>
            <select name="" id="gender">
                <option value="">男生</option>
                <option value="">女生</option>
                <option value="">中性</option>
            </select>
        </p>

        <!-- input:file -->
        <p>
            <!-- <label for="">檔案</label> -->
            <input type="file" name="" id="">
        </p>

        <!-- textarea -->
        <p>
            <label for="">備註</label>
        </p>
        <p>
            <textarea name="" id="" rows="5" cols="50">

            </textarea>
        </p>




        <!-- input:submit 送出  -->
        <p>
            <input type="submit" value="送出">
        </p>



    </form>
</body>

</html>
