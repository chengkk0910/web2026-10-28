<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 50%;
            /* height: 40vh; */
            background-color: lightblue;

            /* 表格置中 */
            margin: auto;
            margin-top: 20px;

            /* 文字置中 */
            text-align: center;

        }

        .container-input{
            background-color: lightblue;
        }

        .container-output{
            background-color: lightpink;
            height: 40vh;
        }
    </style>
</head>

<body>
    <!-- .box -->
    <!-- num1 / num2 / opt / submit -->
    <div class="container-input box">
        <form action="" method="get">
            <p>
                <label for="num1">num1?</label>
                <input type="text" name="num1" id="num1">
            </p>
            <p>
                <label for="num1">num2?</label>
                <input type="text" name="num2" id="num2">
            </p>
            <!-- <p>
                <label for="num1">opt?</label>
                <input type="text" name="opt" id="opt">
            </p> -->
            <p>
                <label for="num1">opt?</label>
                <select name="opt" id="opt">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                </select>
            </p>
            <p>
                <input type="submit" value="submit" id="myBtn">
            </p>
        </form>
    </div>

    <div class="container-output box">

    </div>

</body>

</html>
