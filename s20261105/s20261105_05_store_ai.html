<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            text-align: center;
        }

        tr,
        th,
        td {
            border: 1px solid black;
        }

        td>img {
            width: 150px;
            height: 150px;
        }

        td>input {
            width: 50%;
        }

        .discount {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th width="5%">ID</th>
            <th width="15%">商品</th>
            <th width="10%">價格</th>
            <th width="10%">數量</th>
            <th width="">小計</th>
        </tr>
        <tr>
            <td>1</td>
            <td>
                <img src="./images/p1.jpg" alt="">
                <br>
                咖啡
            </td>
            <td><span id="priceNum1">100</span></td>
            <td>
                <input type="number" name="" id="countNum1" value="1" min="0">
            </td>
            <td>
                <span id="totalNum1">100</span>
            </td>
        </tr>
        <tr>
            <td>2</td>
            <td>
                <img src="./images/p2.jpg" alt="">
                <br>
                花茶
            </td>
            <td id="priceNum2">200</td>
            <td>
                <input type="number" name="" id="countNum2" value="1" min="0">
            </td>
            <td>
                <span id="totalNum2">200</span>
            </td>
        </tr>
        <tr>
            <td>3</td>
            <td>
                <img src="./images/p3.jpg" alt="">
                <br>
                黃金水
            </td>
            <td id="priceNum3">100</td>
            <td>
                <input type="number" name="" id="countNum3" value="1" min="0">
            </td>
            <td>
                <span id="totalNum3">100</span>
            </td>
        </tr>

    </table>

    <table>
        <tr>
            <td>
                總計 : <span id="resultSpan">400</span>
            </td>
        </tr>
    </table>

    <script>
        const ids = [1, 2, 3];

        function calc() {
            let sum = 0;

            for (const i of ids) {
                const price = Number(document.getElementById('priceNum' + i).textContent);
                const countInput = document.getElementById('countNum' + i);
                let count = Number(countInput.value);

                // 防止負數或非數字
                if (!Number.isFinite(count) || count < 0) {
                    count = 0;
                    countInput.value = 0;
                }

                const total = price * count;   // totalNumX = priceNumX * countNumX
                document.getElementById('totalNum' + i).textContent = total;
                sum += total;                  // resultSpan = totalNum1 + totalNum2 + totalNum3
            }

            const resultSpan = document.getElementById('resultSpan');
            if (sum >= 800) {
                const discounted = Math.round(sum * 0.8);
                resultSpan.innerHTML =
                    `原價 <del>${sum}</del>，打 8 折後 <span class="discount">${discounted}</span>`;
            } else {
                resultSpan.textContent = sum;
            }
        }

        // 使用者更改數量時重新計算
        ids.forEach(i => {
            document.getElementById('countNum' + i).addEventListener('change', calc);
        });

        // 頁面載入時先計算一次
        calc();
    </script>
</body>

</html>
