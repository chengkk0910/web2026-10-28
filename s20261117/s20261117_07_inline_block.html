<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .display-block {
            display: block;
        }

        .display-inline {
            display: inline;
        }

        .box {
            width: 300px;
            height: 300px;
            background-color: lightblue;
        }
    </style>
</head>

<body>
    <!-- block 換行 大小 -->
    <!-- inline 不能換行 -->
    <!-- inline-block 不能換行 可以調整大小 -->

    <h3>
        block 換行 大小
    </h3>
    <!-- div , h1 - h6 , p , ul , li -->
    <p class="box">
        Lorem ipsum dolor sit amet.
    </p>
    <div class="box">
        Lorem ipsum dolor sit amet.
    </div>
    <br><br>
    <span class="box">
        Span Lorem ipsum dolor sit amet.
    </span>
    <span class="display-block box">
        Span Lorem ipsum dolor sit amet.
    </span>


    <h3>
        inline 不換行
    </h3>
    <!-- span , a -->
    <span class="box">
        Span Lorem ipsum dolor sit amet.
    </span>

    <span class="display-block box">
        Span Lorem ipsum dolor sit amet.
    </span>

    <div class="display-inline box">
        Lorem ipsum dolor sit amet.
    </div>
    <div class="display-inline box">
        Lorem ipsum dolor sit amet.
    </div>


    <h3>
        inline-block 不換行 可大小
    </h3>
    <!-- img , input , button , select , textarea -->
    <img class="display-block box" src="https://picsum.photos/id/237/200/300" alt="">
    <img class="display-block box" src="https://picsum.photos/id/237/200/300" alt="">
    <input class="display-block box" type="text" name="" id="">
    <input class="display-block box" type="text" name="" id="">

</body>

</html>
