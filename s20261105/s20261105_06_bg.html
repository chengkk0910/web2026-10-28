<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 300px;
            height: 300px;
            background-color: lightblue;
        }

        .box>img {
            width: 100%;
            height: 100%;
        }

        .box1 {
            background-color: lightblue;
        }

        /* https://www.w3schools.com/cssref/playdemo.php?filename=playcss_background-repeat */
        .box2 {
            background-color: lightpink;
            background-image: url('https://picsum.photos/id/20/200/200');
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>
    <div class="box box1 ">
        <img src="https://picsum.photos/id/20/400/400" alt="">
    </div>

    <br>

    <div class="box box2">
    </div>

</body>

</html>
