<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .float-left {
            float: left;
        }

        .float-right {
            float: right;
        }

        .clear-both {
            clear: both;
            /* clear: left;
            clear: right; */
        }

        .box {
            width: 300px;
            height: 300px;
            background-color: lightblue;
            margin-left: 30px ;
            margin-right: 30px ;

            /* float: right; */
            /* 如果外層要動 其他的方式操作 */
            /* float / flexbox / margin */

            /* position: fixed;
            right: 0px;
            bottom: 0px; */
            position: relative;
            /* right: 0px; */
            /* top: 0px; */
            height: 25vh;
        }

        .box21 {
            width: 300px;
            height: 400px;
            background-color: firebrick;
        }

        .box22 {
            width: 300px;
            height: 400px;
            background-color: blueviolet;
        }

        .box-in-right-top {
            width: 50px;
            height: 50px;
            background-color: lightpink;

            position: absolute;
            top: 0px;
            right: 0px;
        }

        .box-in-right-bottom {
            width: 50px;
            height: 50px;
            background-color: lightyellow;

            position: absolute;
            bottom: 0px;
            right: 0px;
        }
    </style>
</head>

<body>
    <div class="clear-both">
        <div class="box box21 float-left">
            <div class="box-in-right-top">

            </div>
            <div class="box-in-right-bottom">

            </div>
        </div>
        <div class="box box22 float-right">
            <div class="box-in-right-top">

            </div>
            <div class="box-in-right-bottom">

            </div>
        </div>
          <div class="box box21 float-left">
            <div class="box-in-right-top">

            </div>
            <div class="box-in-right-bottom">

            </div>
        </div>
        <div class="box box22 float-right">
            <div class="box-in-right-top">

            </div>
            <div class="box-in-right-bottom">

            </div>
        </div>
    </div>

</html>
