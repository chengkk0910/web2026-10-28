<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .display-block {
            display: block;
        }

        .box {
            width: 300px;
            height: 300px;
            background-color: lightblue;
        }
    </style>
</head>

<body>
    <!-- block 換行 大小 -->
    <!-- inline 不能換行 -->
    <!-- inline-block 不能換行 可以調整大小 -->

    <h3>
        block 換行 大小
    </h3>
    <!-- div , h1 - h6 , p , ul , li -->
    <p class="box">
        Lorem ipsum dolor sit amet.
    </p>
    <div class="box">
        Lorem ipsum dolor sit amet.
    </div>
    <br><br>
    <span class="box">
        Span Lorem ipsum dolor sit amet.
    </span>
    <span class="display-block box">
        Span Lorem ipsum dolor sit amet.
    </span>
</body>

</html>
