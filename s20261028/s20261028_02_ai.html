<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 50%;
            /* height: 40vh; */
            background-color: lightblue;

            /* 表格置中 */
            margin: auto;
            margin-top: 20px;

            /* 文字置中 */
            text-align: center;
        }

        .container-input {
            background-color: lightblue;
        }

        .container-output {
            background-color: lightpink;
            height: 40vh;
        }
    </style>
</head>

<body>
    <!-- .box -->
    <!-- num1 / num2 / opt / submit -->
    <div class="container-input box">
        <form action="" method="get">
            <p>
                <label for="num1">num1?</label>
                <input type="text" name="num1" id="num1">
            </p>
            <p>
                <label for="num2">num2?</label>
                <input type="text" name="num2" id="num2">
            </p>
            <p>
                <label for="opt">opt?</label>
                <select name="opt" id="opt">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                </select>
            </p>
            <p>
                <input type="submit" value="submit" id="myBtn">
            </p>
        </form>
    </div>

    <div class="container-output box">

    </div>

    <script>
        const form = document.querySelector('.container-input form');
        const output = document.querySelector('.container-output');

        form.addEventListener('submit', function (e) {
            e.preventDefault(); // 阻止表單送出、頁面重新整理

            const num1 = Number(document.getElementById('num1').value);
            const num2 = Number(document.getElementById('num2').value);
            const opt = document.getElementById('opt').value;

            // 檢查輸入是否為數字
            if (isNaN(num1) || isNaN(num2)) {
                output.textContent = '請輸入有效的數字';
                return;
            }

            let result;
            switch (opt) {
                case '+': result = num1 + num2; break;
                case '-': result = num1 - num2; break;
                case '*': result = num1 * num2; break;
                case '/':
                    if (num2 === 0) {
                        output.textContent = '除數不能為 0';
                        return;
                    }
                    result = num1 / num2;
                    break;
            }

            output.textContent = `${num1} ${opt} ${num2} = ${result}`;
        });
    </script>

</body>

</html>
